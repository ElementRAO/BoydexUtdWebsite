<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boydex United Touch Football</title>
<meta name="description" content="Boydex United social touch football: results, player stats and captain write-ups.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f3f9;--surface:#fff;--ink:#121c2e;--muted:#58657a;--line:#d2d9e6;--turf:#14284b;--turf-ink:#f0f3f9;--bib:#e8590c;--win:#1f7a46;--loss:#b3392b;--bar:#14284b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1426;--surface:#12203a;--ink:#e8edf6;--muted:#9aabc4;--line:#25375a;--turf:#071022;--turf-ink:#e8edf6;--bib:#ff8a4c;--win:#5fcf8a;--loss:#ff7b6b;--bar:#6ea8ff}}
:root[data-theme="dark"]{--bg:#0a1426;--surface:#12203a;--ink:#e8edf6;--muted:#9aabc4;--line:#25375a;--turf:#071022;--turf-ink:#e8edf6;--bib:#ff8a4c;--win:#5fcf8a;--loss:#ff7b6b;--bar:#6ea8ff}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Barlow,system-ui,sans-serif}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
header{background:var(--turf);color:var(--turf-ink);padding:28px 20px 24px;border-bottom:6px solid var(--bib)}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:clamp(40px,10vw,72px);line-height:.95;margin:0 0 6px;font-weight:800}
header p{margin:0;opacity:.8}
.record{display:flex;gap:28px;margin-top:20px;flex-wrap:wrap}
.record div{border-left:3px solid var(--bib);padding-left:10px}
.record .num{font-size:38px;font-weight:800;line-height:1;display:block}
.record span:last-child{font-size:14px;opacity:.8}
main{padding:8px 20px 48px}
section{margin-top:36px}
h2{font-size:30px;font-weight:800;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:360px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
th{font-weight:500;color:var(--muted);font-size:14px;padding:0}
th button{all:unset;cursor:pointer;display:block;width:100%;padding:10px 12px;text-align:inherit;box-sizing:border-box}
th button:focus-visible{outline:2px solid var(--bib);outline-offset:-2px}
th[aria-sort] button{color:var(--ink);font-weight:500}
th[aria-sort="ascending"] button::after{content:" ▲";font-size:10px}
th[aria-sort="descending"] button::after{content:" ▼";font-size:10px}
td:first-child{font-weight:500}
.chart{padding:14px 16px}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;padding:4px 0}
.bar .track{background:var(--line);border-radius:3px;height:18px}
.bar .fill{background:var(--bar);height:100%;border-radius:3px;min-width:2px}
.bar .n{font:800 20px "Barlow Condensed",sans-serif;text-align:right}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game{padding:14px 16px;border-bottom:1px solid var(--line)}
.game:last-child{border-bottom:0}
.gh{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center}
.res{font:800 22px "Barlow Condensed",sans-serif;width:28px}
.W{color:var(--win)}.L{color:var(--loss)}.D{color:var(--muted)}
.opp{font-weight:500}.when{color:var(--muted);font-size:13px;display:block;font-weight:400}
.score{font:800 28px "Barlow Condensed",sans-serif}
.gd{margin:10px 0 0 42px;font-size:15px}
.gd p{margin:0 0 6px}.gd b{font-weight:500;color:var(--muted)}
.wu{margin:12px 0 0 42px;padding-left:12px;border-left:4px solid var(--bib);font-size:15px}
.wu b{display:block;font-weight:500;color:var(--muted);margin-bottom:4px}
.wu p{margin:0 0 6px;max-width:66ch}
.note{border-left:6px solid var(--bib);padding:18px 20px}
.note p{margin:0 0 12px;max-width:66ch}
.note .by{color:var(--muted);font-size:14px;margin:0}
@media(max-width:480px){.bar{grid-template-columns:88px 1fr 24px}.gd{margin-left:0}.wu{margin-left:0}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>Boydex United</h1>
<p>Social touch football</p>
<p style="margin-top:6px"><a href="https://southerntouch.com.au/fixtures-results/" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;text-underline-offset:3px">Fixtures &amp; results on Southern Touch</a></p>
<div class="record">
<div><span class="num" id="rW">0</span><span>Wins</span></div>
<div><span class="num" id="rL">0</span><span>Losses</span></div>
<div><span class="num" id="rD">0</span><span>Draws</span></div>
<div><span class="num" id="rT">0</span><span>Meat pies</span></div>
</div>
</div></header>

<main><div class="wrap">

<section>
<h2>Game by game</h2>
<p class="sub">Who played, who scored and the captain’s write-up. Newest first.</p>
<div class="box" id="games"></div>
</section>

<section>
<h2>Player stats</h2>
<div class="box scroll"><table id="stats">
<thead><tr>
<th data-k="name" data-t="s"><button>Player</button></th>
<th data-k="gp"><button>Games</button></th>
<th data-k="tries"><button>Tries</button></th>
<th data-k="tpg"><button>Tries/game</button></th>
</tr></thead>
<tbody></tbody></table></div>
</section>

<section>
<h2 style="margin-bottom:12px">Meat pies</h2>
<div class="box chart" id="chart"></div>
</section>

</div></main>

<script>
/* EDIT HERE. Add each new game to the end of the games list below.
   For each game: list everyone who played, and tries per scorer. */
var players=["Kieran O'Brien","Rory Orrell","Paul Brooks","Brent Pearco","George Heydon","Ryan Hardy","Luke Jones","John Hooper","Scott Logie","Will Merse","Chris Wardrop","Stuart Hollingsworth","Wes Saunders"];
var games=[
{opp:"Jump Shots",when:"Round 1 · 21 Oct",us:7,them:4,
 played:["Kieran O'Brien","Rory Orrell","Paul Brooks","Brent Pearco","George Heydon","Ryan Hardy","Chris Wardrop","Stuart Hollingsworth","Wes Saunders"],
 tries:{"Kieran O'Brien":1,"Rory Orrell":1,"Paul Brooks":2,"Brent Pearco":1,"Wes Saunders":2},
 writeup:"A winning start to the season: 7–4 over our old foe the Jump Shots in our first game of the season. Full captain’s write-up coming soon."}
];

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var rows=players.map(function(n){
var gp=0,t=0;
games.forEach(function(g){if(g.played.indexOf(n)>-1)gp++;t+=(g.tries[n]||0)});
return {name:n,gp:gp,tries:t,tpg:gp?t/gp:0};});

var sortK="tries",sortDesc=true;
function renderTable(){
var r=rows.slice().sort(function(a,b){
var x=a[sortK],y=b[sortK];
var c=typeof x==="string"?x.localeCompare(y):x-y;
return sortDesc?-c:c;});
document.querySelector("#stats tbody").innerHTML=r.map(function(p){
return "<tr><td>"+esc(p.name)+"</td><td>"+p.gp+"</td><td>"+p.tries+"</td><td>"+p.tpg.toFixed(1)+"</td></tr>";}).join("");
document.querySelectorAll("#stats th").forEach(function(th){
if(th.dataset.k===sortK)th.setAttribute("aria-sort",sortDesc?"descending":"ascending");else th.removeAttribute("aria-sort");});
}
document.querySelectorAll("#stats th").forEach(function(th){
th.querySelector("button").addEventListener("click",function(){
var k=th.dataset.k;
if(sortK===k)sortDesc=!sortDesc;else{sortK=k;sortDesc=th.dataset.t!=="s";}
renderTable();});});

var cols=['#e8590c','#2f6fdb','#1f9d55','#c2358a','#8a5cf5','#b07d00','#0f9fb0','#d64545'];
var ini={},used={};
players.forEach(function(n){var b=n.split(/\s+/).map(function(w){return w.charAt(0).toUpperCase()}).join(''),k=b,c=2;while(used[k]){k=b+c++}used[k]=1;ini[n]=k;});
var sco=players.filter(function(n){return games.some(function(g){return g.tries[n]})});
var rounds=games.map(function(g){return g.when.split(" · ")[0]});
var y0=Math.max.apply(null,[3].concat(games.map(function(g){return Math.max.apply(null,[0].concat(Object.keys(g.tries).map(function(k){return g.tries[k]})))})));
var step=y0<=6?1:Math.ceil(y0/5);
var ymax=Math.ceil(y0/step)*step;
var CW=640,CH=270,CL=56,CR=32,CT=28,CB=40,iw=CW-CL-CR,ih=CH-CT-CB;
function cx(i){return games.length<2?CL+iw/2:CL+iw*i/(games.length-1)}
function cy(v){return CT+ih-ih*v/ymax}
function off(n,i){var v=games[i].tries[n]||0;var g=sco.filter(function(m){return (games[i].tries[m]||0)===v});return (g.indexOf(n)-(g.length-1)/2)*(g.length>1?(games.length<2?30:10):0)}
if(!sco.length){document.getElementById("chart").innerHTML="No tries yet.";}else{
var s='<svg viewBox="0 0 '+CW+' '+CH+'" width="100%" role="img" aria-label="Meat pies scored by each player in each round" style="display:block">';
for(var v=0;v<=ymax;v+=step){s+='<line x1="'+CL+'" x2="'+(CW-CR)+'" y1="'+cy(v)+'" y2="'+cy(v)+'" style="stroke:var(--line)"/><text x="'+(CL-8)+'" y="'+(cy(v)+4)+'" text-anchor="end" font-size="12" style="fill:var(--muted)">'+v+'</text>';}
s+='<g transform="translate(6,'+(CT+ih/2-12)+')" role="img" aria-label="Meat pie"><path d="M3.5 13H20.5L18.5 21H5.5Z" fill="#a8692a"/><path d="M3 13C3 5 21 5 21 13Z" fill="#e2a24b"/><path d="M6 10C8 7 13 6.5 16 8" fill="none" stroke="#f3c477" stroke-width="1.5" stroke-linecap="round"/><ellipse cx="12" cy="8.2" rx="3.2" ry="1.5" fill="#c0392b"/><path d="M7.5 16H16.5" stroke="#8a5220" stroke-width="1" stroke-dasharray="1.5 1.5"/></g>';
sco.forEach(function(n,j){var c=cols[j%cols.length],xy=games.map(function(g,i){return [cx(i)+off(n,i),cy(g.tries[n]||0)]});
if(xy.length>1)s+='<polyline fill="none" stroke-width="2.5" stroke-linejoin="round" points="'+xy.map(function(p){return p[0]+','+p[1]}).join(' ')+'" style="stroke:'+c+'"/>';
xy.forEach(function(p){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="11" style="fill:'+c+'"/><text x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="middle" font-size="10" font-weight="700" style="fill:#fff">'+esc(ini[n])+'</text>';});});
rounds.forEach(function(r,i){s+='<text x="'+cx(i)+'" y="'+(CH-14)+'" text-anchor="middle" font-size="12" style="fill:var(--muted)">'+esc(r)+'</text>';});
s+='</svg><div style="display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:14px">'+sco.map(function(n,j){return '<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:'+cols[j%cols.length]+'"></span>'+esc(ini[n])+'</span>';}).join('')+'</div>';
document.getElementById("chart").innerHTML=s;}

var w=0,l=0,d=0,t=0;
document.getElementById("games").innerHTML=games.slice().reverse().map(function(g){
var r=g.us>g.them?"W":g.us<g.them?"L":"D";
if(r==="W")w++;else if(r==="L")l++;else d++;
t+=g.us;
var sc=Object.keys(g.tries).map(function(n){return esc(ini[n])+(g.tries[n]>1?" ("+g.tries[n]+")":"")}).join(", ");
return '<div class="game"><div class="gh"><span class="res '+r+'">'+r+'</span><span class="opp">vs '+esc(g.opp)+'<span class="when">'+esc(g.when)+'</span></span><span class="score">'+g.us+" – "+g.them+'</span></div><div class="gd"><p><b>Scored:</b> '+(sc||"–")+'</p><p><b>Played ('+g.played.length+'):</b> '+g.played.map(function(n){return esc(ini[n])}).join(", ")+"</p></div>"+(g.writeup?'<div class="wu"><b>Captain’s write-up</b>'+g.writeup.split("\n").map(function(x){return "<p>"+esc(x)+"</p>"}).join("")+"</div>":"")+"</div>";}).join("");
document.getElementById("rW").textContent=w;
document.getElementById("rL").textContent=l;
document.getElementById("rD").textContent=d;
document.getElementById("rT").textContent=t;
renderTable();
</script>
</body>
</html>
